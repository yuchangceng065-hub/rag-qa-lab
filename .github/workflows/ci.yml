name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rag-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install pytest httpx ruff
      - name: Lint (correctness rules)
        run: ruff check .
      - name: Regression tests
        run: python -m pytest tests -q
      - name: Retrieval / abstention / cache quality gate
        run: python evaluate.py --fail-on-regression
      - name: CLI smoke test (answer + abstention)
        run: |
          python cli.py "曲院风荷什么时候看荷花最好"
          python cli.py "量子纠错码的表面码阈值是多少"
